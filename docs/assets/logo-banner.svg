<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="50%" stop-color="#25d366"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="50%" stop-color="#25d366"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b141a"/>
      <stop offset="100%" stop-color="#111b21"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00a884" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Banner Container -->
  <rect width="860" height="220" rx="20" fill="url(#bannerBg)" stroke="#222d34" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Logo Icon Container (Left) -->
  <g transform="translate(40, 40)" filter="url(#glow)">
    <!-- Outer squircle badge -->
    <rect x="0" y="0" width="140" height="140" rx="34" fill="url(#brandGrad)"/>
    <rect x="4" y="4" width="132" height="132" rx="30" fill="#0b141a" fill-opacity="0.94"/>

    <!-- Vault Message Icon -->
    <g transform="translate(25, 25)">
      <!-- Envelope / Vault Box Base -->
      <rect x="5" y="15" width="80" height="54" rx="10" fill="#1f2c34" stroke="#00a884" stroke-width="3"/>
      
      <!-- Envelope Fold Lines -->
      <path d="M7 20L45 48L83 20" stroke="#00a884" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 66L35 43" stroke="#2a3942" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M83 66L55 43" stroke="#2a3942" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Chat Bubble Tail -->
      <path d="M22 69L12 80V69H22Z" fill="#00a884"/>
      
      <!-- Center Vault Search / Lock Symbol -->
      <circle cx="45" cy="48" r="9" fill="#0b141a" stroke="#25d366" stroke-width="3"/>
      <circle cx="45" cy="48" r="3.5" fill="#38bdf8"/>
      <path d="M51.5 54.5L59 62" stroke="#25d366" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography & Description (Right) -->
  <g transform="translate(210, 48)">
    <!-- Brand Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">
      <tspan fill="#e9edef">my</tspan><tspan fill="url(#textGrad)">messages</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#8696a0" letter-spacing="0.2">
      Local-First Personal Messaging Vault &amp; SQLite FTS5 Search Engine
    </text>

    <!-- Tags / Badges -->
    <g transform="translate(0, 106)">
      <!-- Badge 1: Maildir / RFC 5322 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1f2c34" stroke="#2a3942" stroke-width="1"/>
      <text x="65" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00a884" text-anchor="middle">RFC 5322 .EML</text>

      <!-- Badge 2: SQLite FTS5 -->
      <rect x="140" y="0" width="115" height="26" rx="6" fill="#1f2c34" stroke="#2a3942" stroke-width="1"/>
      <text x="197" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#25d366" text-anchor="middle">SQLite FTS5</text>

      <!-- Badge 3: Axum REST /v1/ -->
      <rect x="265" y="0" width="125" height="26" rx="6" fill="#1f2c34" stroke="#2a3942" stroke-width="1"/>
      <text x="327" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Axum API /v1/</text>

      <!-- Badge 4: Native MCP -->
      <rect x="400" y="0" width="135" height="26" rx="6" fill="#1f2c34" stroke="#2a3942" stroke-width="1"/>
      <text x="467" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">MCP (stdio/http)</text>
    </g>
  </g>
</svg>
