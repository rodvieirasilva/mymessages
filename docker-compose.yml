services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.1.2
    container_name: evolution-api
    restart: always
    ports:
      - "8766:8080"
    environment:
      - SERVER_URL=http://localhost:8766
      - DOCKER_ENV=true
      - DATABASE_ENABLED=false
      - AUTHENTICATION_API_KEY=evolution-secret-key
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://mymessages:8765/v1/webhook/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_GLOBAL_BASE64=true
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution-manager:
    image: ghcr.io/evolution-api/evolution-manager-v2:latest
    container_name: evolution-manager
    restart: always
    ports:
      - "8767:3000"
    environment:
      - NEXT_PUBLIC_EVOLUTION_API_URL=http://localhost:8766
      - NEXT_PUBLIC_EVOLUTION_API_KEY=evolution-secret-key
    depends_on:
      evolution-api:
        condition: service_healthy

  mymessages:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mymessages
    restart: always
    user: "10001:10001"
    ports:
      - "8765:8765"
    environment:
      - RUST_LOG=info
      - MYMESSAGES_HOST=0.0.0.0
      - MYMESSAGES_PORT=8765
      - MYMESSAGES_DATA_DIR=/data
    volumes:
      - ./data:/data
      - ./mymessages.toml:/app/mymessages.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8765/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      evolution-api:
        condition: service_healthy

volumes:
  evolution_instances:
