# mymessages Configuration File

[server]
host = "0.0.0.0"
port = 8090
static_dir = "./web/dist"
cors_allowed_origins = ["*"]

# Modular list of storage targets
[[storages]]
name = "maildir"
type = "maildir"
enabled = true
path = "./data/mail"

[[storages]]
name = "sqlite"
type = "sqlite"
enabled = true
path = "./data/messages.sqlite3"

# Ingestion Adapters
[adapters.evolution]
enabled = true
webhook_path = "/api/v1/webhook/evolution"

[adapters.folder]
enabled = true
folder_path = "./test_messages"
file_pattern = "*.json"
