# mymessages Configuration File

[server]
host = "0.0.0.0"
port = 8765
static_dir = "./web/dist"
cors_allowed_origins = ["*"]

# Modular list of storage targets
[[storages]]
name = "maildir"
type = "maildir"
enabled = true
path = "./data/mail"

[[storages]]
name = "sqlite"
type = "sqlite"
enabled = true
path = "./data/messages.sqlite3"

# Ingestion Adapters
[adapters.evolution]
enabled = true
webhook_path = "/api/v1/webhook/evolution"

[adapters.waha]
enabled = true
webhook_path = "/api/v1/webhook/waha"
api_url = "http://127.0.0.1:8768"
api_key = "waha-secret-key"

[adapters.folder]
enabled = true
folder_path = "./tests/test_messages"
file_pattern = "*.json"
