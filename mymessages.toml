# mymessages Configuration File

[server]
host = "0.0.0.0"
port = 8765
cors_allowed_origins = ["http://localhost:8765", "http://127.0.0.1:8765"]

# Modular list of storage targets
[[storages]]
name = "maildir"
type = "maildir"
enabled = true
path = "./data/mail"

[[storages]]
name = "sqlite"
type = "sqlite"
enabled = true
path = "./data/messages.sqlite3"

# Ingestion Adapters
[adapters.evolution]
enabled = true
webhook_path = "/v1/webhook/evolution"

[adapters.waha]
enabled = true
webhook_path = "/v1/webhook/waha"
api_url = "http://127.0.0.1:8768"

[adapters.folder]
enabled = true
folder_path = "./tests/test_messages"
file_pattern = "*.json"

# UBack Android Backup Adapter (zero-duplication media + .crypt15 decryption)
# Keys are loaded automatically from env vars `WHATSAPP_64DIGI_<account>` or `credentials_file`
[adapters.uback]
enabled = false
backup_root = ""
# credentials_file = "~/.credentials"
accounts = []
index_media_without_db = false
