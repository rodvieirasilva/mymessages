[package]
name = "mymessages"
version = "0.3.2"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1"
hex = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled", "bundled-full"] }
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6"
utoipa-swagger-ui = { version = "10", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1.5"
