<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="mailGrad" x1="14" y1="18" x2="50" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#bgGrad)"/>
  <rect x="7" y="7" width="50" height="50" rx="12" fill="#0f172a" fill-opacity="0.92"/>
  
  <!-- Mail & Chat Vault Symbol -->
  <g filter="url(#glow)">
    <!-- Envelope Base -->
    <rect x="14" y="19" width="36" height="24" rx="4.5" fill="url(#mailGrad)"/>
    <!-- Flap Line -->
    <path d="M14 21L32 33.5L50 21" stroke="#4f46e5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Chat Tail Accent -->
    <path d="M20 43L15 48V43H20Z" fill="#06b6d4"/>
    <!-- Vault Keyhole / Search Dot -->
    <circle cx="32" cy="37" r="3" fill="#6366f1"/>
    <path d="M32 40V42" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
