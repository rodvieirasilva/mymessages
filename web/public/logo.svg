<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer squircle badge -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#brandGrad)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#0b141a" fill-opacity="0.94"/>

  <!-- Vault Message Icon -->
  <g transform="translate(19, 19)" filter="url(#glow)">
    <!-- Envelope / Vault Base -->
    <rect x="5" y="15" width="80" height="54" rx="10" fill="#1f2c34" stroke="#3b82f6" stroke-width="3.5"/>
    
    <!-- Envelope Fold Lines -->
    <path d="M7 20L45 48L83 20" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M7 66L35 43" stroke="#2a3942" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M83 66L55 43" stroke="#2a3942" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Chat Bubble Tail -->
    <path d="M22 69L12 80V69H22Z" fill="#3b82f6"/>
    
    <!-- Center Vault Search / Lock Symbol -->
    <circle cx="45" cy="48" r="9.5" fill="#0b141a" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="45" cy="48" r="3.5" fill="#38bdf8"/>
    <path d="M52 55L60 63" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
